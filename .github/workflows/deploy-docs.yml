name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material[imaging]>=9.5,<10"

      - name: Create docs directory with symlinks
        run: |
          mkdir -p docs
          cp README.md docs/index.md
          ln -s ../images docs/images
          ln -s ../javascripts docs/javascripts
          find . -maxdepth 1 -type d -name 'chapter *' | while IFS= read -r dir; do
            dir="${dir#./}"
            ln -s "../$dir" "docs/$dir"
          done

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
